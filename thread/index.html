<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seizi | スレッドを開く</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,Helvetica,Arial,sans-serif; margin:0; padding:24px; background:#0F1419; color:#F0F4F8;}
    .card{max-width:720px; margin:0 auto; background:#16202B; border:1px solid #2A3B4D; border-radius:14px; padding:20px;}
    h1{font-size:18px; margin:0 0 8px;}
    p{margin:8px 0; color:#B8C5D6; line-height:1.6;}
    .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
    button,a{appearance:none; border:0; border-radius:12px; padding:12px 14px; font-weight:700; cursor:pointer; text-decoration:none;}
    .primary{background:#5B8DEF; color:#0A1628;}
    .ghost{background:#1D2A39; color:#F0F4F8; border:1px solid #2A3B4D;}
    code{background:#1D2A39; padding:2px 6px; border-radius:8px;}
    .small{font-size:12px; color:#6B7D93;}
  </style>
</head>
<body>
  <div class="card">
    <h1>スレッドをアプリで開きます</h1>
    <p id="desc">リンクを解析中…</p>

    <div class="btns">
      <a id="openBtn" class="primary" href="#">アプリで開く</a>
      <button id="copyBtn" class="ghost" type="button">リンクをコピー</button>
    </div>

    <p class="small">うまく開かない場合：ブラウザのメニューから「外部ブラウザで開く」を選ぶと、アプリに切り替わることがあります。</p>
  </div>

  <script>
    // Expected path: /thread/{threadId}/{threadType}/{topicId}
    const parts = location.pathname.split('/').filter(Boolean);
    const desc = document.getElementById('desc');
    const openBtn = document.getElementById('openBtn');

    function setLink(url){
      openBtn.href = url;
      desc.innerHTML = `対象: <code>${location.pathname}</code><br>起動URL: <code>${url}</code>`;
    }

    if (parts.length >= 4 && parts[0] === 'thread') {
      const threadId = parts[1];
      const threadType = parts[2];
      const topicId = parts[3];
      const schemeUrl = `seiziapp://thread/${encodeURIComponent(threadId)}/${encodeURIComponent(threadType)}/${encodeURIComponent(topicId)}`;
      setLink(schemeUrl);

      // Try auto-open (best-effort)
      setTimeout(() => { location.href = schemeUrl; }, 200);
    } else {
      desc.textContent = 'このリンク形式は未対応です。';
      openBtn.style.display = 'none';
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        alert('コピーした');
      } catch (e) {
        prompt('コピーしてね', location.href);
      }
    });
  </script>
</body>
</html>
